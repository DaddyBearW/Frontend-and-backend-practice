<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <h1 class="header__title">Магазин</h1>
        </header>

        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="index.html">Главная</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="news.html">Новости</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="practices.html">Практики</a>
                </li>
                <li class="nav__item nav__item--active">
                    <a class="nav__link nav__link--active" href="goods.html">Товары</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="contacts.html">Контакты</a>
                </li>
            </ul>
        </nav>

        <main class="main">
            <section class="products">
                <h2 class="products__title">Наши товары</h2>
                <div class="products__grid">
                    <article class="product-card">
                        <img src="Img/goods1.png" alt="Онимару Куницуна" class="product-card__image">
                        <h3 class="product-card__name">Онимару Куницуна</h3>
                        <p class="product-card__price">5350 руб.</p>
                    </article>
                    <article class="product-card">
                        <img src="Img/goods2.png" alt="Operator Древнее плямя" class="product-card__image">
                        <h3 class="product-card__name">Operator"Древнее плямя"</h3>
                        <p class="product-card__price">2475 руб.</p>
                    </article>
                    <article class="product-card">
                        <img src="Img/goods3.png" alt="Vandal Нептун" class="product-card__image">
                        <h3 class="product-card__name">Vandal"Нептун"</h3>
                        <p class="product-card__price">1775 руб.</p>
                    </article>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">© 2025 Aka DaddyBear</p>
        </footer>

        <div class="theme-switcher">
            <button class="theme-switcher__button">🌙</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('selectedTheme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const button = document.querySelector('.theme-switcher__button');
            if (button) {
                button.textContent = theme === 'light' ? '🌙' : '☀️';
            }
        }

        function applySavedTheme() {
            const savedTheme = localStorage.getItem('selectedTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        document.addEventListener('DOMContentLoaded', function () {
            applySavedTheme();

            const themeButton = document.querySelector('.theme-switcher__button');
            if (themeButton) {
                themeButton.addEventListener('click', toggleTheme);
            }
        });
    </script>
</body>
</html>
