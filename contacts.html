<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="style/styles.css">
    <style>
        .modal::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        .modal {
            border: none;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90vw;
        }

        .modal__header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px 12px 0 0;
        }

        .modal__title {
            margin: 0;
            color: white;
            font-size: 1.5rem;
        }

        .modal__content {
            padding: 2rem;
        }

        .form__group {
            margin-bottom: 1.5rem;
        }

        .form__label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .form__input,
        .form__select,
        .form__textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

            .form__input:focus,
            .form__select:focus,
            .form__textarea:focus {
                outline: none;
                border-color: #667eea;
            }

        .form__textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form__required {
            color: #e74c3c;
        }

        .modal__actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .button--primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

            .button--primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

        .button--secondary {
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e9ecef;
        }

            .button--secondary:hover {
                background: #e9ecef;
            }

        @media (max-width: 600px) {
            .modal {
                margin: 1rem;
                width: calc(100vw - 2rem);
            }

            .modal__actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <h1 class="header__title">Контакты</h1>
        </header>

        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="index.html">Главная</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="news.html">Новости</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="practices.html">Практики</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="goods.html">Товары</a>
                </li>
                <li class="nav__item nav__item--active">
                    <a class="nav__link nav__link--active" href="contacts.html">Контакты</a>
                </li>
            </ul>
        </nav>

        <main class="main">
            <section class="contacts">
                <h2 class="contacts__title">Наши контакты</h2>

                <div class="contacts__grid">
                    <div class="contact-item">
                        <h3 class="contact-item__title">Электронная почта</h3>
                        <p class="contact-item__value">mosentsmichael@mail.ru</p>
                    </div>

                    <div class="contact-item">
                        <h3 class="contact-item__title">Физический адрес</h3>
                        <p class="contact-item__value">г. Москва, пр-кт Вернадского, 78с4</p>
                    </div>

                    <div class="contact-item">
                        <h3 class="contact-item__title">Телефон</h3>
                        <p class="contact-item__value">+7 (985) 769-11-53</p>
                    </div>
                </div>

                <button class="contact-button" onclick="contactModal.showModal()">Связаться с нами</button>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">© 2025 Aka DaddyBear</p>
        </footer>

        <!-- Модальное окно для формы обратной связи -->
        <dialog class="modal" id="contactModal">
            <div class="modal__header">
                <h2 class="modal__title">Форма обратной связи</h2>
            </div>

            <div class="modal__content">
                <form class="form" id="feedbackForm">
                    <div class="form__group">
                        <label class="form__label" for="name">
                            Имя <span class="form__required">*</span>
                        </label>
                        <input class="form__input" type="text" id="name" name="name" required placeholder="Введите ваше имя">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="phone">
                            Телефон <span class="form__required">*</span>
                        </label>
                        <input class="form__input" type="tel" id="phone" name="phone" required placeholder="+7 (XXX) XXX-XX-XX">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="email">
                            Электронная почта <span class="form__required">*</span>
                        </label>
                        <input class="form__input" type="email" id="email" name="email" required placeholder="example@mail.ru">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="category">
                            Категория обращения <span class="form__required">*</span>
                        </label>
                        <select class="form__select" id="category" name="category" required>
                            <option value="">Выберите категорию</option>
                            <option value="technical">Техническая поддержка</option>
                            <option value="commercial">Коммерческое предложение</option>
                            <option value="cooperation">Сотрудничество</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="message">
                            Текст обращения <span class="form__required">*</span>
                        </label>
                        <textarea class="form__textarea" id="message" name="message" required placeholder="Опишите вашу проблему или вопрос..."></textarea>
                    </div>

                    <div class="modal__actions">
                        <button class="button button--secondary" type="button" onclick="contactModal.close()">Отмена</button>
                        <button class="button button--primary" type="button" onclick="submitForm()">Отправить</button>
                    </div>
                </form>
            </div>
        </dialog>

        <div class="theme-switcher">
            <button class="theme-switcher__button">🌙</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('selectedTheme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const button = document.querySelector('.theme-switcher__button');
            if (button) {
                button.textContent = theme === 'light' ? '🌙' : '☀️';
            }
        }

        function applySavedTheme() {
            const savedTheme = localStorage.getItem('selectedTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        function submitForm() {
            const form = document.getElementById('feedbackForm');
            const formData = new FormData(form);

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const data = {
                name: formData.get('name'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                category: formData.get('category'),
                message: formData.get('message')
            };

            console.log('Данные формы:', data);
            alert('Спасибо! Ваше обращение отправлено. Мы свяжемся с вами в ближайшее время.');
            contactModal.close();
            form.reset();
        }

        document.addEventListener('DOMContentLoaded', function () {
            applySavedTheme();

            const themeButton = document.querySelector('.theme-switcher__button');
            if (themeButton) {
                themeButton.addEventListener('click', toggleTheme);
            }
        });

        document.getElementById('contactModal').addEventListener('click', function (event) {
            if (event.target === this) {
                this.close();
            }
        });
    </script>
</body>
</html>
